name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify required publication files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            CHANGELOG.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            .env.example
            .gitignore
            docs/ARCHITECTURE.md
            docs/MVP.md
            docs/ROADMAP.md
            docs/SECURITY_MODEL.md
            docs/GNUCASH_SAFETY.md
            docs/DEVELOPMENT.md
            .github/FUNDING.yml
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/bug_report.yml
            .github/ISSUE_TEMPLATE/feature_request.yml
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Verify sensitive files are not tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|secrets?$|credentials?$)|data/books/.*\.(sqlite|sqlite3|gnucash|db)$|data/backups/.'; then
            echo "Sensitive data file appears to be tracked. Remove it before publishing."
            exit 1
          fi

      - name: Verify public status drift guard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_public_status.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        if: hashFiles('apps/web/package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install and verify frontend
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f apps/web/package.json ]; then
            echo "apps/web not present; skipping frontend checks."
            exit 0
          fi
          cd apps/web
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if [ -f eslint.config.js ] || [ -f .eslintrc ] || [ -f .eslintrc.cjs ] || [ -f .eslintrc.json ]; then
            npm run lint
          else
            echo "No ESLint config present; skipping npm run lint until lint config is added."
          fi
          npm run check
          npm run test:auth-routes
          npm run test:transaction-entry-preview
          npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        if: hashFiles('apps/api/requirements.txt') != '' || hashFiles('apps/api/pyproject.toml') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install and test backend
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f apps/api/requirements.txt ] && [ ! -f apps/api/pyproject.toml ]; then
            echo "apps/api not present; skipping backend checks."
            exit 0
          fi
          cd apps/api
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install -e .
          fi
          python -m pytest tests/ -q

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Docker Compose file
        shell: bash
        run: |
          set -euo pipefail
          if [ -f docker-compose.yml ]; then
            JWT_SECRET=ci-only-compose-validation-secret docker compose config --quiet
          else
            echo "docker-compose.yml not found; skipping."
          fi
