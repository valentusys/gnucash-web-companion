name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required foundation files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            CHANGELOG.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            .env.example
            docs/ARCHITECTURE.md
            docs/MVP.md
            docs/ROADMAP.md
            docs/SECURITY_MODEL.md
            docs/GNUCASH_SAFETY.md
            docs/DEVELOPMENT.md
            docs/handoff/phase-1.md
            .github/FUNDING.yml
            .github/PULL_REQUEST_TEMPLATE.md
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Frontend checks
        shell: bash
        run: |
          set -euo pipefail
          if [ -f apps/web/package.json ]; then
            cd apps/web
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run check
            npm run build
          else
            echo "apps/web skeleton not created yet; skipping frontend checks."
          fi

      - name: Backend checks
        shell: bash
        run: |
          set -euo pipefail
          if [ -f apps/api/pyproject.toml ] || [ -f apps/api/requirements.txt ]; then
            cd apps/api
            pip install -r requirements.txt
            python -m pytest tests/ -v
          else
            echo "apps/api skeleton not created yet; skipping backend checks."
          fi

      - name: Verify Docker Compose file
        shell: bash
        run: |
          set -euo pipefail
          if [ -f docker-compose.yml ]; then
            docker compose config --quiet || { echo "Invalid docker-compose.yml"; exit 1; }
          else
            echo "docker-compose.yml not found; skipping."
          fi
