name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include real financial data, secrets, or private GnuCash files.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, Docker version, commit/version
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checklist
      options:
        - label: I did not attach real financial data or secrets.
          required: true
        - label: This bug report does not request write/edit behavior for the read-only MVP.
          required: false
